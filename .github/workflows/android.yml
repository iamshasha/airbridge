name: Android

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v4

      # Interop tests need the Swift CLI and skip themselves here; run them on a Mac.
      - name: Core tests
        run: ./gradlew :core:test --console=plain

      - name: Build APK
        run: ./gradlew :app:assembleRelease --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: AirBridge-android
          path: android/app/build/outputs/apk/release/*.apk
