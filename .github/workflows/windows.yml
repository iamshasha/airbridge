name: Windows

on:
  push:
    paths: ["windows/**", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["windows/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Interop tests need the Swift CLI (run them on a Mac); parsing and path-safety tests run here.
      - name: Core tests
        run: dotnet test windows/tests/AirBridge.Core.Tests --filter "FullyQualifiedName~CapabilityParsingTests"

      - name: Build app (x64)
        run: dotnet publish windows/src/AirBridge.App -c Release -r win-x64 -p:Platform=x64 -o out/AirBridge-win-x64

      # Launch the published exe and make sure it is still running (and has a window) after 20 s.
      - name: Smoke test (x64)
        shell: pwsh
        run: |
          if (-not (Test-Path out/AirBridge-win-x64/AirBridge.pri)) { throw "AirBridge.pri missing from publish output" }
          $p = Start-Process out/AirBridge-win-x64/AirBridge.exe -PassThru
          Start-Sleep -Seconds 20
          $p.Refresh()
          $log = Join-Path $env:LOCALAPPDATA "AirBridge\crash.log"
          if (Test-Path $log) { Get-Content $log }
          if ($p.HasExited) { throw "AirBridge exited with code $($p.ExitCode)" }
          "Running; window handle: $($p.MainWindowHandle)"
          if (Test-Path $log) { throw "AirBridge logged a crash" }
          # A second launch must hand over to the running copy and exit, not start another one.
          $second = Start-Process out/AirBridge-win-x64/AirBridge.exe -PassThru
          if (-not $second.WaitForExit(15000)) { throw "Second launch did not exit" }
          if ((Get-Process AirBridge -ErrorAction SilentlyContinue).Count -ne 1) { throw "Expected exactly one AirBridge running" }
          $p.Refresh()
          if ($p.HasExited) { throw "First instance exited after the second launch" }
          Stop-Process -Id $p.Id -Force

      # Self-update: a build labelled 0.0.1 must replace itself with the latest GitHub release and restart.
      - name: Update test (x64)
        shell: pwsh
        run: |
          dotnet publish windows/src/AirBridge.App -c Release -r win-x64 -p:Platform=x64 -p:Version=0.0.1 -o out/update-test
          $exe = (Resolve-Path out/update-test/AirBridge.exe).Path
          $before = (Get-Item $exe).VersionInfo.ProductVersion
          $env:AIRBRIDGE_UPDATE_TEST = "1"
          Start-Process $exe
          $env:AIRBRIDGE_UPDATE_TEST = $null
          $deadline = (Get-Date).AddMinutes(4)
          do {
            Start-Sleep -Seconds 3
            $after = (Get-Item $exe).VersionInfo.ProductVersion
          } until ($after -ne $before -or (Get-Date) -gt $deadline)
          "Before: $before, after: $after"
          if ($after -eq $before) { throw "AirBridge did not update itself" }
          Start-Sleep -Seconds 8
          $running = Get-Process AirBridge -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $exe }
          if (-not $running) { throw "The updated AirBridge did not restart" }
          "Restarted: $($running.Id)"
          $running | Stop-Process -Force

      - name: Build app (ARM64)
        run: dotnet publish windows/src/AirBridge.App -c Release -r win-arm64 -p:Platform=ARM64 -o out/AirBridge-win-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: AirBridge-win-x64
          path: out/AirBridge-win-x64

      - uses: actions/upload-artifact@v4
        with:
          name: AirBridge-win-arm64
          path: out/AirBridge-win-arm64
